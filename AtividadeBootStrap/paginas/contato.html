<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/index.html">PetVida</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/index.html">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="/paginas/produtos.html">Produtos</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="/paginas/contato.html">Contato</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">

        <div class="card shadow p-4">
          <h2 class="text-center mb-4">Entre em Contato</h2>

          <form>

            <div class="mb-3">
              <label class="form-label">Nome</label>

              <input 
                type="text"
                class="form-control"
                placeholder="Digite seu nome"
              >
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>

              <input 
                type="email"
                class="form-control"
                placeholder="Digite seu email"
              >
            </div>

            <div class="mb-3">
              <label class="form-label">Mensagem</label>

              <textarea 
                class="form-control"
                rows="5"
                placeholder="Digite sua mensagem"
              ></textarea>
            </div>

            <button class="btn btn-success w-100">
              Enviar Mensagem
            </button>

          </form>
        </div>

      </div>
    </div>
  </section>

  <footer class="bg-dark text-white text-center p-3">
    © 2026 PetVida - Site realizado para fins educacionais
  </footer>

</body>
</html>
